[project]
name = "comfyui-hi3d"
version = "1.0.0"
description = "ComfyUI nodes for Hi3D v1.0: image-conditioned refinement of coarse meshes into high-resolution geometry (512/1024/1536). Pure PyTorch, no spconv/flash-attn/Triton, no automatic downloads."
readme = "README.md"
requires-python = ">=3.10"
# Mixed component rights, including excluded sample media: no single SPDX
# expression covers the repository. See LICENSE, NOTICE and THIRD_PARTY_LICENSES.md.
license = { file = "LICENSE" }
classifiers = ["Operating System :: OS Independent"]
# torch, numpy, scipy, Pillow and safetensors come with ComfyUI itself.
dependencies = [
    "pyfqmr>=0.4.0",
]

[project.urls]
Repository = "https://github.com/susanoo1337/hi3dv1.0"
"Upstream Hi3D" = "https://github.com/hi3d-official/Hi3Dv1.0"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.comfy]
PublisherId = ""
DisplayName = "ComfyUI-Hi3D"
Icon = ""
includes = []

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Vendored FlexiCubes keeps upstream's star import of the table data.
"hi3d/flexicubes/flexicubes.py" = ["F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
